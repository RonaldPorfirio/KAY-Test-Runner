# Publish manually to .github/workflows/kay-python-tests.yml ONLY after approval.
name: KAY synthetic Python tests
run-name: kay-${{ inputs.job }}
on:
  workflow_dispatch:
    inputs:
      job:
        required: true
        type: string
      code_commit:
        required: true
        type: string
      package_sha256:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: kay-synthetic-tests
  cancel-in-progress: false
jobs:
  test:
    if: github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Trusted controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: controller
          persist-credentials: false
          fetch-depth: 1
      - name: Approved package only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.code_commit }}
          path: payload
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Fixed dependencies; no project requirements
        run: python -m pip install --disable-pip-version-check --no-cache-dir pytest==8.3.5 pluggy==1.5.0 packaging==24.2 iniconfig==2.0.0
      - name: Fixed test profile
        env:
          KAY_JOB: ${{ inputs.job }}
          KAY_COMMIT: ${{ inputs.code_commit }}
          KAY_PACKAGE: ${{ inputs.package_sha256 }}
        run: python -I controller/runner.py
      - name: Bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kay-${{ inputs.job }}
          path: |
            output/result.json
            output/stdout.txt
            output/stderr.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
